services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PB_VERSION: "0.40.1"
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Alleen data persistent; pb_public en pb_migrations komen uit de image (COPY).
      # Volume-mounts op pb_public/pb_migrations overschrijven de image met lege host-dirs.
      - ./pb_data:/pb/pb_data
